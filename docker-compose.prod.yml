name: mglyph-web

# ! WARNING: .env files have to be set up manually for production deployment !

# Docker Compose configuration for Production environment

services:

  api:
    depends_on:
      - db
    restart: unless-stopped
    build: 
      context: ./api
      dockerfile: ./Prod.Dockerfile
    volumes:
      - api_data_files_prod:/code/src/data/files
    ports:
      - 8888:8888

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    volumes:
      - db_data_prod:/var/lib/postgresql/data

  ui:
    restart: unless-stopped
    build: 
      context: ./ui
      dockerfile: ./Prod.Dockerfile
    ports:
      - 8080:80

volumes:
  db_data_prod:
  api_data_files_prod:

secrets:
  postgres_password:
    file: ./docker_config/postgres_password_prod.secret
  postgres_user:
    file: ./docker_config/postgres_user_prod.secret
  postgres_db:
    file: ./docker_config/postgres_db_prod.secret
